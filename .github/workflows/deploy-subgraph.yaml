name: Deploy subgraph
on:
  workflow_dispatch:
jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    env:
      SUBGRAPH_NAME: st0x-rbac
      # Public query base for this Ormi account. subgraph-deploy probes it and skips a version that already answers.
      ORMI_QUERY_BASE: https://subgraph.api.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71
    steps:
      # Shared nix + cachix CI preamble; the pinned third-party action SHAs live
      # in the composite. 1G is the store budget for a subgraph build.
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          gc-max-store-size-linux: 1G
      # subgraph-deploy builds from the committed subgraph/abis + subgraph/generated,
      # so it needs no forge build and runs on the slim subgraph shell.
      - run: nix develop github:rainlanguage/rainix#subgraph-shell -c subgraph-deploy
        env:
          # GitHub secret ORMI_DEPLOY_KEY, from Vault secret/infra/rain/ormi (deploy_key).
          ORMI_DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}
