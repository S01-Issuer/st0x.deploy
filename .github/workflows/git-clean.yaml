name: Git is clean
on: [push]
jobs:
  git-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          checkout: 'false'
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          gc-max-store-size-linux: 1G
      - name: Install soldeer dependencies
        if: hashFiles('soldeer.lock') != ''
        run: nix develop github:rainlanguage/rainix#sol-shell -c forge soldeer install
      - name: Regenerate pointer artifacts + deploy libs
        run: nix develop github:rainlanguage/rainix#sol-shell -c forge script ./script/BuildPointers.sol
      - name: Regenerate privileged-addresses.json
        run: nix develop github:rainlanguage/rainix#sol-shell -c forge script ./script/BuildPrivilegedAddresses.sol
      - name: Regenerate ideal-roles.json
        run: nix develop github:rainlanguage/rainix#sol-shell -c forge script ./script/BuildIdealRoles.sol
      - name: Format
        run: nix develop github:rainlanguage/rainix#sol-shell -c forge fmt
      - name: Assert committed artifacts match freshly built
        run: |
          if ! git diff --exit-code; then
            echo "::error::Committed pointer artifacts are stale. Regenerate and commit."
            exit 1
          fi
