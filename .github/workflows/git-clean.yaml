name: Git is clean
on: [push]
jobs:
  git-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@5bb6a3b3abe66fd09bbf250dce8ada94f856a703 # v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      # Substitute the rainix shells from Cachix instead of building them. Every
      # rainix shell carries `rainix-static`, a rust build, and crates.io is
      # answering 403 to the runners, so without this the shell cannot be built
      # at all and every step here dies before it runs. The rainix reusable
      # workflows get this from their own shared preamble; this lane is
      # hand-rolled and has to be told. `continue-on-error` so a Cachix outage
      # degrades to a normal build rather than failing the job.
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # No store-watching daemon: it checkpoints the nix DB concurrently
          # with cache-nix-action and corrupts it.
          useDaemon: false
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
      - name: Install soldeer dependencies
        if: hashFiles('soldeer.lock') != ''
        run: nix develop github:rainlanguage/rainix#sol-shell -c forge soldeer install
      - name: Regenerate pointer artifacts + deploy libs
        run: nix develop github:rainlanguage/rainix#sol-shell -c forge script ./script/BuildPointers.sol
      - name: Format
        run: nix develop github:rainlanguage/rainix#sol-shell -c forge fmt
      - name: Assert committed artifacts match freshly built
        run: |
          if ! git diff --exit-code; then
            echo "::error::Committed pointer artifacts are stale. Regenerate and commit."
            exit 1
          fi
