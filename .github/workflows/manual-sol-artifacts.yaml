name: Manual sol artifacts
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "The `StoxDeploySuites` suite to deploy to every network this repo deploys to"
        required: true
        type: choice
        options:
          - stox-corporate-actions-facet
          - stox-receipt
          - stox-receipt-vault
          - stox-wrapped-token-vault
          - stox-wrapped-token-vault-beacon
          - stox-offchain-asset-receipt-vault-authorizer
          - stox-offchain-asset-receipt-vault-payment-mint-authorizer
          - stox-orchestrator
          - stox-attest-sub-parser
          - stox-eu-assets-authoriser
          - stox-token-tMSTR
          - stox-token-tTSLA
          - stox-token-tCOIN
          - stox-token-tSPYM
          - stox-token-tSIVR
          - stox-token-tCRCL
          - stox-token-tNVDA
          - stox-token-tIAU
          - stox-token-tPPLT
          - stox-token-tAMZN
          - stox-token-tBMNR
          - stox-token-tIBHG
          - stox-token-tSGOV
          - stox-token-tQQQM
          - stox-token-tVWO
          - stox-token-tARKK
          - stox-token-tSPCX
          - stox-token-tCEG
          - stox-token-tDRAM
          - stox-token-tTSM
          - stox-token-tSKHY
          - stox-token-tASML
          - stox-token-tMU
          - stox-token-tAMD
          - stox-token-tAVGO
          - stox-token-tAMAT
          - stox-token-tLRCX
          - stox-token-tTTWO
          - stox-token-tRKLB
          - stox-token-tGOOGL
          - stox-token-tAAPL
          - stox-token-tMSFT
          - stox-token-tLLY
          - stox-token-tPTY
          - stox-token-tINTC
          - stox-token-tHOOD
          - stox-token-tORCL
          - stox-token-tSMCI
          - stox-token-tBABA
          - stox-token-tTQQQ
          - stox-token-tFTF
          - stox-token-tCBRS
          - stox-token-tMCD
          - stox-token-tNKE
          - stox-token-tGRND
          - stox-token-tDNUT
          - stox-token-tPLBY
          - stox-token-tTR
          - stox-token-tWEN
          - stox-token-tFGI
          - stox-token-tBIRD
          - stox-token-tSPY
          - stox-token-tSNES
          - stox-token-tWMT
          - stox-token-tMC
          - stox-token-tDIS
          - stox-corporate-actions-facet@0_1_1
          - stox-receipt@0_1_1
          - stox-receipt-vault@0_1_1
          - stox-wrapped-token-vault@0_1_1
          - stox-wrapped-token-vault-beacon@0_1_1
          - stox-wrapped-token-vault-beacon-set-deployer@0_1_1
          - stox-offchain-asset-receipt-vault-beacon-set-deployer@0_1_1
          - stox-unified-deployer@0_1_1
          - stox-offchain-asset-receipt-vault-authorizer@0_1_1
          - stox-offchain-asset-receipt-vault-payment-mint-authorizer@0_1_1
          - stox-corporate-actions-facet@0_1_30
          - stox-receipt@0_1_30
          - stox-receipt-vault@0_1_30
          - stox-offchain-asset-receipt-vault-beacon-set-deployer@0_1_30
          - stox-orchestrator@0_1_30
          - stox-orchestrator-beacon-set-deployer@0_1_30
      legacy:
        description: "Send type-0 transactions on every network this run broadcasts to. HyperEVM needs them; Robinhood Chain rejects them. A network where the suite already has code is skipped before fee estimation, so a suite new to both chains takes one dispatch each way."
        required: false
        type: boolean
        default: false
      verify:
        description: "Verify on the block explorer after broadcasting. A released suite's code is not current source, so leave it off for those; `Manual sol verify` repairs verification later."
        required: false
        type: boolean
        default: false
jobs:
  deploy:
    concurrency:
      group: manual-sol-artifacts
      cancel-in-progress: false
    uses: rainlanguage/rainix/.github/workflows/rainix-manual-sol-artifacts.yaml@main
    with:
      suite: ${{ inputs.suite }}
      legacy: ${{ inputs.legacy }}
      verify: ${{ inputs.verify }}
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      EXPLORER_VERIFICATION_KEY: ${{ secrets.EXPLORER_VERIFICATION_KEY }}
      RPC_URL_BASE_FORK: ${{ secrets.RPC_URL_BASE_FORK }}
      RPC_URL_ETHEREUM_FORK: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
      RPC_URL_HYPEREVM_FORK: ${{ secrets.RPC_URL_HYPEREVM_FORK }}
      RPC_URL_ROBINHOOD_FORK: ${{ secrets.RPC_URL_ROBINHOOD_FORK }}
      RPC_URL_BSC_FORK: ${{ secrets.RPC_URL_BSC_FORK }}
      CI_DEPLOY_BASE_ETHERSCAN_API_KEY: ${{ secrets.CI_DEPLOY_BASE_ETHERSCAN_API_KEY }}
      CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY: ${{ secrets.CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY }}
      CI_DEPLOY_HYPEREVM_ETHERSCAN_API_KEY: ${{ secrets.CI_DEPLOY_HYPEREVM_ETHERSCAN_API_KEY }}
      CI_DEPLOY_ROBINHOOD_ETHERSCAN_API_KEY: ${{ secrets.CI_DEPLOY_ROBINHOOD_ETHERSCAN_API_KEY }}
      CI_DEPLOY_BSC_ETHERSCAN_API_KEY: ${{ secrets.CI_DEPLOY_BSC_ETHERSCAN_API_KEY }}
