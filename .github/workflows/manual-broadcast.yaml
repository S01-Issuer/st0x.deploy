name: manual-broadcast
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Broadcast script to dispatch (broadcasts as the CI deploy key)'
        required: true
        type: choice
        options:
          # Append-only registry: add new entries at the bottom; never reorder
          # or delete. Re-dispatching a historical (executed) script must
          # remain possible — a signer/auditor may want to re-run its
          # pre-flight against on-chain reality to confirm what landed.
          #
          # Each entry is the date-prefixed filename (without `.s.sol`) of a
          # broadcast script under `script/`. Convention:
          # `YYYYMMDD-<kebab-name>`, where the date is the day the script was
          # added to this dropdown. Execution status (PENDING / EXECUTED)
          # lives in the script's file-level NatSpec — this dropdown is a
          # registry of *which* scripts exist, not *whether* they've run.
          - 20260619-deploy-v4-authoriser-clone
          - 20260706-deploy-tokens-ethereum
          - 20260722-deploy-missing-tokens-ethereum
          - 20260722-deploy-missing-tokens-hyperevm
          - 20260729-deploy-governance-timelock
      network:
        description: 'Network to broadcast against (default: base)'
        required: true
        type: choice
        default: 'base'
        options:
          # The chain to broadcast against — the foundry.toml `[rpc_endpoints]`
          # alias (`--rpc-url <network>`) and the key selecting which RPC
          # secret to expose. The Ethereum bootstrap broadcasts (authoriser
          # clone, token deploy) use `ethereum`; the original Base deploys use
          # `base`.
          - 'base'
          - 'ethereum'
          - 'hyperevm'
# Dispatches an operational broadcast script from `script/` and sends the
# resulting transactions from the CI deploy key (`secrets.PRIVATE_KEY`,
# the same secret `manual-sol-artifacts-0-1-1.yaml` uses for Zoltu impl deploys).
#
# When to use this dispatcher vs. run-script.yaml:
# - `run-script.yaml` is for scripts that emit off-chain artifacts
#   (Safe Tx Builder JSON) for a Safe multisig to sign later. Runs
#   without `--broadcast`.
# - THIS workflow is for scripts that broadcast on-chain directly from
#   the deploy key — same key that runs `manual-sol-artifacts-0-1-1.yaml` for
#   impl deploys. Runs with `--broadcast`.
#
# The `slow` flag makes forge wait for each tx to confirm before sending
# the next; without it a script that lands a sequence of dependent txs
# (e.g. deploy → grantRole using the deploy) can race the nonce.
jobs:
  broadcast:
    name: Broadcast operational script
    runs-on: ubuntu-latest
    # Least-privilege: the job only checks out the repo and runs forge; the
    # on-chain broadcast authenticates via `secrets.PRIVATE_KEY`, so the
    # ambient GITHUB_TOKEN needs nothing beyond read.
    permissions:
      contents: read
    # Serialise dispatches of the same script so overlapping runs don't
    # race on the same nonce / pre-flight state.
    concurrency:
      group: manual-broadcast-${{ inputs.script }}-${{ inputs.network }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
      - name: Install Soldeer dependencies
        run: nix develop --command forge soldeer install
      - name: Broadcast script
        env:
          # Expose every network's RPC; `--rpc-url ${NETWORK}` selects which
          # one foundry.toml resolves via its `[rpc_endpoints]` aliases.
          BASE_RPC_URL: ${{ secrets.RPC_URL_BASE_FORK }}
          ETHEREUM_RPC_URL: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
          HYPEREVM_RPC_URL: ${{ secrets.RPC_URL_HYPEREVM_FORK }}
          # Pass the choice inputs via env rather than template-expanding them
          # into the command, so the dispatched values are used as literal
          # arguments and cannot inject shell.
          SCRIPT: ${{ inputs.script }}
          NETWORK: ${{ inputs.network }}
          # PRIVATE_KEY is only available inside this step — matching
          # `manual-sol-artifacts-0-1-1.yaml`. The workflow file itself does not
          # persist it anywhere else.
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          # HyperEVM's RPC rejects forge's EIP-1559 fee-history estimation;
          # type-0 transactions work on every network. Multi-chain scripts
          # broadcast to HyperEVM inside a single run regardless of which
          # network was dispatched, so they always take the legacy path.
          LEGACY_ARGS=()
          if [[ "${NETWORK}" == "hyperevm" || "${SCRIPT}" == "20260729-deploy-governance-timelock" ]]; then
            LEGACY_ARGS+=(--legacy)
          fi
          nix develop --command forge script "script/${SCRIPT}.s.sol" \
            "${LEGACY_ARGS[@]}" \
            --sig 'run()' \
            --rpc-url "${NETWORK}" \
            --no-storage-caching \
            --slow \
            --broadcast \
            --private-key "${PRIVATE_KEY}"
      # `forge script --verify` cannot serve a multi-chain broadcast: it
      # resolves one explorer from `--rpc-url` and then fails to locate the
      # contracts that landed on the other chains. Verifying from the script's
      # own per-chain manifest instead targets each explorer correctly, and
      # keeps working on a re-dispatch where every chain is skipped and no
      # broadcast artifact is produced.
      - name: Verify deployments
        if: ${{ inputs.script == '20260729-deploy-governance-timelock' }}
        env:
          # Etherscan-family keys, per chain. Absent or free-tier keys simply
          # skip that chain's Etherscan leg; Sourcify still runs.
          CI_DEPLOY_BASE_ETHERSCAN_API_KEY: ${{ secrets.CI_DEPLOY_BASE_ETHERSCAN_API_KEY }}
          CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY: ${{ secrets.CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY }}
          CI_DEPLOY_HYPEREVM_ETHERSCAN_API_KEY: ${{ secrets.CI_DEPLOY_HYPEREVM_ETHERSCAN_API_KEY }}
          # `--guess-constructor-args` reads the creation transaction over RPC.
          BASE_RPC_URL: ${{ secrets.RPC_URL_BASE_FORK }}
          ETHEREUM_RPC_URL: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
          HYPEREVM_RPC_URL: ${{ secrets.RPC_URL_HYPEREVM_FORK }}
        run: |
          MANIFEST=out/20260729-governance-timelock-deployments.json
          CONTRACT=dependencies/@openzeppelin-contracts-5.6.1/governance/TimelockController.sol:TimelockController
          jq -c '.[]' "${MANIFEST}" | while read -r entry; do
            CHAIN=$(echo "${entry}" | jq -r '.chainId')
            NET=$(echo "${entry}" | jq -r '.network')
            ADDR=$(echo "${entry}" | jq -r '.address')

            # Sourcify: no API key, and the only verifier that covers all three
            # chains including HyperEVM. Matches on bytecode, so it needs
            # neither constructor args nor an RPC endpoint.
            echo "Sourcify: verifying ${ADDR} on chain ${CHAIN}"
            nix develop --command forge verify-contract \
              --verifier sourcify \
              --chain "${CHAIN}" \
              --watch \
              "${ADDR}" \
              "${CONTRACT}"

            # Etherscan: what actually surfaces on Basescan/Etherscan, since
            # they do NOT ingest Sourcify. Needs a paid v2 key for any chain
            # beyond mainnet, so run it only where a key is configured rather
            # than failing the whole deploy on a missing or free-tier key.
            KEY_VAR="CI_DEPLOY_$(echo "${NET}" | tr '[:lower:]' '[:upper:]')_ETHERSCAN_API_KEY"
            if [[ -n "${!KEY_VAR:-}" ]]; then
              echo "Etherscan: verifying ${ADDR} on ${NET}"
              nix develop --command forge verify-contract \
                --chain "${NET}" \
                --rpc-url "${NET}" \
                --watch \
                --guess-constructor-args \
                "${ADDR}" \
                "${CONTRACT}"
            else
              echo "Etherscan: no ${KEY_VAR} configured, skipping ${NET}"
            fi
          done
