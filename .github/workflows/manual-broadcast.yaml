name: manual-broadcast
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Broadcast script to dispatch (broadcasts as the CI deploy key)'
        required: true
        type: choice
        options:
          # Append-only registry: add new entries at the bottom; never reorder.
          # Re-dispatching a historical (executed) script must remain possible
          # — a signer/auditor may want to re-run its pre-flight against
          # on-chain reality to confirm what landed.
          #
          # An entry may be DELETED only when a named successor listed here
          # covers its pre-flight at least as strongly, and the deleted
          # script's broadcast run id has been carried into the pin its run
          # produced. `20261006-deploy-eu-authoriser` was removed under that
          # rule: its successor is
          # `manual-sol-artifacts.yaml` suite `stox-eu-assets-authoriser`, and
          # its run id is pinned beside `STOX_EU_AUTHORISER_CLONE`.
          #
          # Each entry is the date-prefixed filename (without `.s.sol`) of a
          # broadcast script under `script/`. Convention:
          # `YYYYMMDD-<kebab-name>`, where the date is the day the script was
          # added to this dropdown. Whether a script has run is the chain's
          # record (executed scripts refuse re-dispatch in pre-flight, and
          # pins record what landed) — this dropdown is a registry of *which*
          # scripts exist, not *whether* they've run.
          - 20261021-execute-underlying-naming
          - 20261109-execute-revoke-service-signer-deposit-withdraw
      sig:
        description: 'Entrypoint to dispatch (default: run())'
        required: true
        type: choice
        default: 'run()'
        options:
          - 'run()'
          - 'execute()'
      network:
        description: 'Network to broadcast against (default: base)'
        required: true
        type: choice
        default: 'base'
        options:
          # The chain to broadcast against — the foundry.toml `[rpc_endpoints]`
          # alias (`--rpc-url <network>`) and the key selecting which RPC
          # secret to expose. The Ethereum bootstrap broadcasts (authoriser
          # clone, token deploy) use `ethereum`; the original Base deploys use
          # `base`.
          - 'base'
          - 'ethereum'
          - 'hyperevm'
          - 'robinhood'
          - 'bsc'
          # Dispatches an operational broadcast script from `script/` and sends the
          # resulting transactions from the CI deploy key (`secrets.PRIVATE_KEY`).
          #
          # When to use this dispatcher vs. run-script.yaml:
          # - `run-script.yaml` is for scripts that emit off-chain artifacts
          #   (Safe Tx Builder JSON) for a Safe multisig to sign later. Runs
          #   without `--broadcast`.
          # - THIS workflow is for scripts that broadcast on-chain directly from
          #   the deploy key. Runs with `--broadcast`.
          #
          # The `slow` flag makes forge wait for each tx to confirm before sending
          # the next; without it a script that lands a sequence of dependent txs
          # (e.g. deploy → grantRole using the deploy) can race the nonce.
      legacy:
        description: >-
          Send type-0 transactions. Always on for a HyperEVM dispatch. Robinhood Chain rejects type-0 (gas-price oracle below the base fee).
        required: false
        type: boolean
        default: false
      rpc_throttle:
        description: >-
          Throttle forge's fork RPC usage for a rate-limited public archive endpoint: caps the assumed compute units per second at 60 and retries rate-limit responses (30 retries, 2s initial backoff) instead of aborting the run. Needed for long broadcasts (the 41-token copy) on chains where the only archive RPC available is a public one (BNB Smart Chain: blastapi 429s under forge's default request rate).
        required: false
        type: boolean
        default: false
jobs:
  broadcast:
    name: Broadcast operational script
    runs-on: ubuntu-latest
    # Least-privilege: the job only checks out the repo and runs forge; the
    # on-chain broadcast authenticates via `secrets.PRIVATE_KEY`, so the
    # ambient GITHUB_TOKEN needs nothing beyond read.
    permissions:
      contents: read
    # Serialise dispatches of the same script so overlapping runs don't
    # race on the same nonce / pre-flight state. Single-chain scripts key on
    # network too (per-chain nonces cannot collide across networks), but a
    # MULTI-CHAIN script broadcasts on every chain regardless of the
    # selected network, so all its dispatches must share ONE group — list
    # each multi-chain script in the ternary below.
    concurrency:
      group: manual-broadcast-${{ inputs.script }}-${{ inputs.network }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
      - name: Install Soldeer dependencies
        run: nix develop --command forge soldeer install
      - name: Broadcast script
        env:
          # Expose every network's RPC; `--rpc-url ${NETWORK}` selects which
          # one foundry.toml resolves via its `[rpc_endpoints]` aliases.
          BASE_RPC_URL: ${{ secrets.RPC_URL_BASE_FORK }}
          ETHEREUM_RPC_URL: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
          HYPEREVM_RPC_URL: ${{ secrets.RPC_URL_HYPEREVM_FORK }}
          ROBINHOOD_RPC_URL: ${{ secrets.RPC_URL_ROBINHOOD_FORK }}
          BSC_RPC_URL: ${{ secrets.RPC_URL_BSC_FORK }}
          # Pass the choice inputs via env rather than template-expanding them
          # into the command, so the dispatched values are used as literal
          # arguments and cannot inject shell.
          SCRIPT: ${{ inputs.script }}
          SIG: ${{ inputs.sig }}
          NETWORK: ${{ inputs.network }}
          LEGACY: ${{ inputs.legacy }}
          RPC_THROTTLE: ${{ inputs.rpc_throttle }}
          # PRIVATE_KEY is only available inside this step. The workflow file
          # itself does not persist it anywhere else.
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          # HyperEVM's RPC rejects forge's EIP-1559 fee-history estimation,
          # so a broadcast that lands on HyperEVM needs type-0. Robinhood
          # Chain rejects type-0 the other way round (its gas-price oracle
          # quotes below the block base fee), so `--legacy` cannot be
          # unconditional for a multi-chain script. A chain the script skips
          # (code already at the pin) is never fee-estimated, so the flag is
          # only needed when HyperEVM is actually going to receive a
          # transaction: always for a HyperEVM dispatch, otherwise per the
          # `legacy` input.
          LEGACY_ARGS=()
          if [[ "${NETWORK}" == "hyperevm" || "${LEGACY}" == "true" ]]; then
            LEGACY_ARGS+=(--legacy)
          fi
          THROTTLE_ARGS=()
          if [[ "${RPC_THROTTLE}" == "true" ]]; then
            THROTTLE_ARGS+=(--compute-units-per-second 60 --fork-retries 30 --fork-retry-backoff 2000)
          fi
          nix develop --command forge script "script/${SCRIPT}.s.sol" \
            "${LEGACY_ARGS[@]}" \
            "${THROTTLE_ARGS[@]}" \
            --sig "${SIG}" \
            --rpc-url "${NETWORK}" \
            --no-storage-caching \
            --slow \
            --broadcast \
            --private-key "${PRIVATE_KEY}"
