name: run-script
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Operational script to dispatch'
        required: true
        type: choice
        options:
          # Append-only registry: add new entries at the bottom; never reorder.
          # An entry stays after its script has run, so its pre-flight can be
          # re-run against the chain. It leaves the list only when its script
          # is history-only: its `run()` refuses and the V5 backfill writes its
          # root-line record.
          #
          # Each entry is the date-prefixed filename (without `.s.sol`) of a
          # Safe Tx Builder JSON emitting script under `script/`. Convention:
          # `YYYYMMDD-<kebab-name>`, where the date is the day the script was
          # added to this dropdown. Whether a script has run is the chain's
          # record, not this list. `WorkflowChoicesTest` requires every entry
          # to name a script that is not history-only, and every script to be
          # listed here, in `manual-broadcast.yaml`, or as history-only.
          #
          # Broadcast scripts (dispatched with `--broadcast` from the CI
          # deploy key) live in `manual-broadcast.yaml` instead.
          - 20260729-migrate-governance-to-timelock
          - 20261006-orchestrator-admin-to-timelock
          - 20260619-migrate-multisig-threshold
          - 20261030-backfill-migration-registry-v5
          - 20261021-schedule-underlying-naming-beacons
          - 20261021-schedule-underlying-naming-rename
          - 20261021-execute-underlying-naming
          - 20261022-bind-beacon-initial-owner
          - 20261103-hand-safe-owned-base-vaults-to-timelock
          - 20261109-schedule-revoke-service-signer-deposit-withdraw
          - 20261109-execute-revoke-service-signer-deposit-withdraw
          - 20261111-qsep-set-fleet-authoriser
          - 20261113-bind-orchestrator-config
          - 20261119-create-zerog-tokens
          - 20261123-schedule-zerog-orchestrator-roles
          - 20261123-execute-zerog-orchestrator-roles
      network:
        description: 'Network to author against (default: base)'
        required: true
        type: choice
        default: 'base'
        options:
          # The chain whose head fork the authoring dry-runs against — the
          # foundry.toml `[rpc_endpoints]` alias (`--rpc-url <network>`).
          # Chain-aware scripts (e.g. the governance-timelock migration)
          # self-scope from `block.chainid`, so the same registry entry
          # authors each chain's bundle by re-dispatching per network.
          - 'base'
          - 'ethereum'
          - 'hyperevm'
          - 'robinhood'
          - 'bsc'
          - 'zerog'
      sig:
        description: 'Entrypoint to dispatch (default: run())'
        required: true
        type: choice
        default: 'run()'
        options:
          # Append-only registry of entrypoint signatures. The dispatcher does
          # not validate that the selected script implements the selected
          # signature — `forge script` will surface a clear revert if not.
          #
          # `verify(string)` is intentionally NOT listed: it is always a local
          # signer-side check run against a downloaded artifact — it takes a
          # JSON path argument this dispatcher can't supply and runs off-chain
          # on the signer's machine, not in CI.
          - 'run()'
          # The 0G orchestrator roles cancel recovery:
          # `20261123-schedule-zerog-orchestrator-roles` on `zerog` only.
          - 'reschedule()'
# Manually dispatches an operational script from `script/` and uploads any
# JSON it writes to `out/` as a build artifact.
#
# Operational scripts produce off-chain artifacts (Safe Tx Builder JSON,
# signer briefs) under `out/`. They run a full on-chain pre-flight, simulate
# the post-state, emit the artifact, and log the canonical hash that signers
# must verify. The dry-run uses an unpinned head fork of the selected
# network so any drift in the underlying contracts trips the pre-flight
# here before a signer ever sees the bundle.
#
# Why a single dispatcher rather than one workflow per script:
# - The Actions sidebar stays tight as more scripts accumulate.
# - Boilerplate (nix install, soldeer install, artifact upload) lives in
#   one place.
# - Adding a new script is a single yaml entry + a new file under
#   `script/`, no new workflow file.
#
# The `sig` input lets a single script expose multiple entrypoints (e.g.
# `run()` and `mirrorGrants()` on the V4 authoriser deploy) without
# splitting them into separate dispatcher entries. `forge --sig` is the
# canonical way to pick which function `forge script` calls.
jobs:
  run:
    permissions:
      contents: read
    uses: rainlanguage/rainix/.github/workflows/rainix-run-script.yaml@main
    with:
      script: ${{ inputs.script }}
      network: ${{ inputs.network }}
      sig: ${{ inputs.sig }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      RPC_URL_BASE_FORK: ${{ secrets.RPC_URL_BASE_FORK }}
      RPC_URL_BSC_FORK: ${{ secrets.RPC_URL_BSC_FORK }}
      RPC_URL_ETHEREUM_FORK: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
      RPC_URL_HYPEREVM_FORK: ${{ secrets.RPC_URL_HYPEREVM_FORK }}
      RPC_URL_ROBINHOOD_FORK: ${{ secrets.RPC_URL_ROBINHOOD_FORK }}
      RPC_URL_ZEROG_FORK: ${{ secrets.RPC_URL_ZEROG_FORK }}
