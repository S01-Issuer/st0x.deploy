name: multisig-artifact
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'script/20260619-migrate-multisig-threshold.s.sol'
      - 'src/lib/LibSafeInvariants.sol'
      - '.github/workflows/multisig-artifact.yaml'
# Builds the Safe Tx Builder JSON for the multisig threshold migration
# via a forge-script dry-run and uploads `out/*.json` as a build artifact.
# `workflow_dispatch` lets a maintainer run the job manually from the
# GitHub UI to produce the bundle for live submission; the `pull_request`
# trigger (paths-filtered to the migration code and its dependencies)
# runs the dry-run as a sanity check whenever the migration touches any
# of those files. Either way, the dry-run uses the same unpinned Base
# head fork as the migration script's tests, so any drift in the Safe's
# owner set, threshold, or vault ownership trips the pre-flight here
# before a signer ever sees the bundle.
jobs:
  build-artifact:
    runs-on: ubuntu-latest
    # id-token: rainix's fork proxy signs in to our own Base node with this
    # job's GitHub OIDC token. Nothing in the job writes to the repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
      - name: Install Soldeer dependencies
        run: nix develop --command forge soldeer install
      # Prebuilt rainix-static for the proxy below (read-only pull).
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        continue-on-error: true
        with:
          name: rainlanguage
          useDaemon: false
      # BASE_RPC_URL points at a local eRPC: our own Base node first, then
      # public Base RPCs, then the RPC_URL_BASE_FORK secret, failing over per
      # request. Candidates travel as env, never as `with:` inputs, because a
      # keyed URL embeds its API key.
      - name: RPC proxy
        uses: rainlanguage/rainix/.github/actions/rpc-proxy@main
        env:
          RAINIX_RPC_SECRET_BASE: ${{ secrets.RPC_URL_BASE_FORK }}
          RAINIX_RPC_VARS_BASE: ${{ vars.RPC_URL_BASE_FORK }}
      - name: Build Tx Builder artifact (dry-run)
        run: |
          nix develop --command bash -c '
            forge script script/20260619-migrate-multisig-threshold.s.sol \
              --rpc-url base \
              --no-storage-caching
          '
      - name: RPC proxy report
        if: always()
        uses: rainlanguage/rainix/.github/actions/rpc-proxy@main
        with:
          mode: report
      - name: Upload Tx Builder JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safe-threshold-tx-builder-json
          path: out/*.json
          if-no-files-found: error
