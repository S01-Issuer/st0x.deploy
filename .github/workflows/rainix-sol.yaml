# Push CI for every branch. The fork suite reads ~10k storage slots per run at
# `latest`, so nothing carries over between runs and every run pays the full
# RPC bill again (~0.4M Alchemy CU, about 55 runs on a busy day).
#
# Branch pushes therefore run on public RPCs: the paid fork secrets are passed
# only on main, and on branches they are empty, so rainix's rpc-preflight
# falls through to any RPC_URL_*_FORK variable and its hardcoded public
# archive defaults. Main and rainix-sol-scheduled keep the paid endpoints.
# Robinhood and Flare are passed everywhere: neither secret is the paid
# Alchemy key, so gating them saves nothing. BSC is passed everywhere too: no
# public BSC node serves eth_getLogs at an old block (bsc-dataseed answers
# "limit exceeded", publicnode wants a token), and LibStoxMigrations needs one.
#
# A newer push to the same branch cancels the run it makes stale. Main keeps
# one group per commit, so every merge still gets its own run.
name: rainix-sol
on: [push]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  rainix-sol:
    uses: rainlanguage/rainix/.github/workflows/rainix-sol.yaml@main
    secrets:
      RPC_URL_ARBITRUM_FORK: ${{ github.ref == 'refs/heads/main' && secrets.RPC_URL_ARBITRUM_FORK || '' }}
      RPC_URL_BASE_FORK: ${{ github.ref == 'refs/heads/main' && secrets.RPC_URL_BASE_FORK || '' }}
      RPC_URL_BASE_SEPOLIA_FORK: ${{ github.ref == 'refs/heads/main' && secrets.RPC_URL_BASE_SEPOLIA_FORK || '' }}
      RPC_URL_BSC_FORK: ${{ secrets.RPC_URL_BSC_FORK }}
      RPC_URL_ETHEREUM_FORK: ${{ github.ref == 'refs/heads/main' && secrets.RPC_URL_ETHEREUM_FORK || '' }}
      RPC_URL_FLARE_FORK: ${{ secrets.RPC_URL_FLARE_FORK }}
      RPC_URL_HYPEREVM_FORK: ${{ github.ref == 'refs/heads/main' && secrets.RPC_URL_HYPEREVM_FORK || '' }}
      RPC_URL_POLYGON_FORK: ${{ github.ref == 'refs/heads/main' && secrets.RPC_URL_POLYGON_FORK || '' }}
      RPC_URL_ROBINHOOD_FORK: ${{ secrets.RPC_URL_ROBINHOOD_FORK }}
