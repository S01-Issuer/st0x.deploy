name: Timelock verify settings
on:
  push:
    paths:
      - 'foundry.toml'
      - 'soldeer.lock'
      - 'remappings.txt'
      - 'flake.nix'
      - 'flake.lock'
      - 'script/timelock-verify.sh'
      - '.github/workflows/timelock-verify-check.yaml'
      - '.github/workflows/manual-broadcast.yaml'
jobs:
  timelock-verify-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          checkout: 'false'
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          gc-max-store-size-linux: 1G
      - name: Install Soldeer dependencies
        run: nix develop --command forge soldeer install
      - name: Verification build reproduces rain-deploy's timelock snapshot
        run: nix develop --command bash script/timelock-verify.sh check
