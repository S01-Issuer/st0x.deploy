name: Package Release
# Deploy repo: a manual `sol-v*` tag on main is the sole release trigger. The
# frozen `src/generated/<version>/` snapshot and `[external.package].version`
# reach main first through a reviewed PR cut by `Build.cutRelease()`; this
# workflow only verifies and publishes.
on:
  push:
    tags:
      - sol-v*
jobs:
  release:
    # The reusable's release job requests contents: write (GitHub release), and
    # this repo's default workflow token is read-only.
    permissions:
      contents: write
    uses: rainlanguage/rainix/.github/workflows/rainix-tag-release.yaml@main
    with:
      soldeer-package: st0x-deploy
    # Explicit, not `inherit`: rainix is another org.
    secrets:
      SOLDEER_API_TOKEN: ${{ secrets.SOLDEER_API_TOKEN }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      RPC_URL_ARBITRUM_FORK: ${{ secrets.RPC_URL_ARBITRUM_FORK }}
      RPC_URL_BASE_FORK: ${{ secrets.RPC_URL_BASE_FORK }}
      RPC_URL_BASE_SEPOLIA_FORK: ${{ secrets.RPC_URL_BASE_SEPOLIA_FORK }}
      RPC_URL_BSC_FORK: ${{ secrets.RPC_URL_BSC_FORK }}
      RPC_URL_ETHEREUM_FORK: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
      RPC_URL_FLARE_FORK: ${{ secrets.RPC_URL_FLARE_FORK }}
      RPC_URL_HYPEREVM_FORK: ${{ secrets.RPC_URL_HYPEREVM_FORK }}
      RPC_URL_POLYGON_FORK: ${{ secrets.RPC_URL_POLYGON_FORK }}
      RPC_URL_ROBINHOOD_FORK: ${{ secrets.RPC_URL_ROBINHOOD_FORK }}
