name: Package Release
on:
  push:
    tags:
      - sol-v*
jobs:
  release:
    # rainix-tag-release verifies the tag, re-attests the live chain against the
    # pins, checks the frozen snapshot is a fresh regeneration, publishes to
    # soldeer and creates the GitHub release — so it needs contents: write. It
    # writes to no branch. This repo's default workflow-token permission is
    # read-only, so grant that scope here or the reusable's request exceeds the
    # caller and the run fails at startup. No id-token: nothing in the reusable
    # uses OIDC (Soldeer publishes via SOLDEER_API_TOKEN).
    permissions:
      contents: write
    # A DEPLOY repo is on the tag-release lifecycle, not autopublish. The
    # release order is: deploy (the `Manual sol artifacts` dispatch), then a PR
    # that bumps `[external.package].version` and runs
    # `forge script ./script/Build.sol --sig "cutRelease()"` to freeze
    # `src/generated/<version>/`, then a `sol-vX.Y.Z` tag on the merged commit,
    # which triggers this workflow.
    uses: rainlanguage/rainix/.github/workflows/rainix-tag-release.yaml@main
    with:
      soldeer-package: st0x-deploy
      tag-prefix: sol-v
    # Secrets passed explicitly (not `inherit`), mirroring this repo's other
    # cross-org rainix callers — exactly the set rainix-tag-release declares. The
    # RPC_URL_*_FORK secrets are what its verify step forks with; omitting them
    # reintroduces the "env var not found" verify failure.
    secrets:
      SOLDEER_API_TOKEN: ${{ secrets.SOLDEER_API_TOKEN }}
      PUBLISH_PRIVATE_KEY: ${{ secrets.PUBLISH_PRIVATE_KEY }}
      CI_GIT_EMAIL: ${{ secrets.CI_GIT_EMAIL }}
      CI_GIT_USER: ${{ secrets.CI_GIT_USER }}
      RPC_URL_ARBITRUM_FORK: ${{ secrets.RPC_URL_ARBITRUM_FORK }}
      RPC_URL_BASE_FORK: ${{ secrets.RPC_URL_BASE_FORK }}
      RPC_URL_BASE_SEPOLIA_FORK: ${{ secrets.RPC_URL_BASE_SEPOLIA_FORK }}
      RPC_URL_ETHEREUM_FORK: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
      RPC_URL_FLARE_FORK: ${{ secrets.RPC_URL_FLARE_FORK }}
      RPC_URL_POLYGON_FORK: ${{ secrets.RPC_URL_POLYGON_FORK }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
