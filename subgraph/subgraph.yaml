  - kind: ethereum/contract
    name: WrappedTokenVaultBeacon
    network: robinhood
    source:
      abi: UpgradeableBeacon
      address: "0x9FD790f65CA3aF2772358c653F097f0a4c7EE7d2"
      startBlock: 59699489
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Contract
        - OwnershipTransfer
        - BeaconUpgrade
      abis:
        - name: UpgradeableBeacon
          file: ./abis/UpgradeableBeacon.json
      eventHandlers:
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleWrappedTokenVaultBeaconOwnershipTransferred
        - event: Upgraded(indexed address)
          handler: handleWrappedTokenVaultBeaconUpgraded
      file: ./src/wrappedtokenvaultbeacon.ts
  - kind: ethereum/contract
