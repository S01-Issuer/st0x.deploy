    source:
      abi: TimelockController
      address: "0x831E4e1bB2b9a67C00b7d17F252A18a22cd0bD2B"
      startBlock: 59818983
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Contract
        - Role
        - RoleHolder
        - RoleGrant
        - RoleAdminChange
        - TimelockOperationKey
        - TimelockOperation
        - TimelockCall
      abis:
        - name: TimelockController
          file: ./abis/TimelockController.json
      eventHandlers:
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleTimelockRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleTimelockRoleRevoked
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleTimelockRoleAdminChanged
