# The ST0x RBAC / ownership index.
#
# One subgraph is deployed per network (see `networks.json`), so every entity
# here is implicitly scoped to a single chain and nothing carries a chain id.
# "per contract per chain" from the issue therefore means "per `Contract` row in
# the deployment for that chain".
#
# Role ids are the raw `bytes32` the contract emits, never a label: the
# on-chain value is `keccak256("MINT")`-style and the preimage is not in the
# log. A consumer that wants names hashes its own label list and matches.

"What kind of contract a `Contract` row describes."
enum ContractKind {
  "An `OffchainAssetReceiptVaultAuthorizerV1` clone — the `AccessControl` that holds every vault action role."
  AUTHORIZER
  "The chain's `TimelockController` — the `AccessControl` that holds `PROPOSER_ROLE` / `EXECUTOR_ROLE` / `CANCELLER_ROLE`."
  GOVERNANCE_TIMELOCK
  "An `ST0xOrchestrator` beacon proxy — `AccessControl`, discovered from its deployer."
  ORCHESTRATOR
  "An `UpgradeableBeacon` — `Ownable`, and the only kind that emits `Upgraded`."
  BEACON
  "An `OffchainAssetReceiptVault` beacon proxy — `Ownable`, discovered from its deployer."
  RECEIPT_VAULT
  "The chain's token-owner `Safe` 1.4.1 proxy — its owners and threshold govern every privileged surface the timelock does not."
  TOKEN_OWNER_SAFE
}

"""
One indexed contract. Created the first time this subgraph sees the contract:
for a static data source that is its first matching log, for a templated data
source it is the handler that created the template.
"""
type Contract @entity {
  "The contract address."
  id: Bytes!
  "What the contract is."
  kind: ContractKind!
  """
  The lower bound of this contract's indexed event history — the block this
  subgraph first brought the contract into view. Nothing the contract emitted
  before this block is in `ownershipTransfers` / `upgrades` / `roles` here.

  For a contract found by discovery it is the block its data source template was
  created in, and the cutoff is real. For a static data source it is the block
  of the first log matched from it, which is a conservative bound rather than a
  tight one: every `startBlock` in `networks.json` is at or below the block the
  contract was created in, so that history is in fact complete. See
  `ownerFromLog` and `implementationFromLog` for whether the current values came
  from a log at all.
  """
  firstIndexedBlock: BigInt!
  """
  The current owner, for an `Ownable` contract. Null means no owner has been
  established: either the contract is not `Ownable`, or it is and no
  `OwnershipTransferred` has been seen since `firstIndexedBlock`.
  """
  owner: Bytes
  """
  The block at which `owner` was established — the block of the
  `OwnershipTransferred` that set it, or, for a beacon found by discovery, the
  block whose state the discovery read `owner()` against.
  """
  ownerAsOfBlock: BigInt
  "True when `owner` came from an `OwnershipTransferred` log rather than an `owner()` read at discovery."
  ownerFromLog: Boolean!
  "The current implementation, for a beacon. Null for every other kind."
  implementation: Bytes
  "The block at which `implementation` was established, same two sources as `ownerAsOfBlock`."
  implementationAsOfBlock: BigInt
  "True when `implementation` came from an `Upgraded` log rather than an `implementation()` read at discovery."
  implementationFromLog: Boolean!
  "Every role this contract has ever emitted an event for."
  roles: [Role!]! @derivedFrom(field: "contract")
  "Ownership history, oldest first by `blockNumber`."
  ownershipTransfers: [OwnershipTransfer!]! @derivedFrom(field: "contract")
  "Beacon implementation history, oldest first by `blockNumber`."
  upgrades: [BeaconUpgrade!]! @derivedFrom(field: "contract")
  "Every operation scheduled on this contract, for a governance timelock. Empty for every other kind."
  timelockOperations: [TimelockOperation!]! @derivedFrom(field: "timelock")
  "The current owners, for a Safe: `SafeSetup`'s owners, then every `AddedOwner` and `RemovedOwner`. Null for every other kind."
  safeOwners: [Bytes!]
  "The current confirmation threshold, for a Safe. Null for every other kind."
  threshold: BigInt
  "The block of the `SafeSetup` or `ChangedThreshold` that set `threshold`."
  thresholdAsOfBlock: BigInt
  "Threshold history, oldest first by `blockNumber`. Empty for every other kind."
  thresholdChanges: [SafeThresholdChange!]! @derivedFrom(field: "contract")
  "Owner history, oldest first by `blockNumber`. Empty for every other kind."
  safeOwnerChanges: [SafeOwnerChange!]! @derivedFrom(field: "contract")
}

"""
One (contract, role) pair. Created the first time any event names the role, so
a role nobody has ever been granted and whose admin has never been set has no
row — `AccessControl` emits nothing for it.
"""
type Role @entity {
  "`contract` address ++ the `bytes32` role."
  id: Bytes!
  "The contract the role is defined on."
  contract: Contract!
  "The raw `bytes32` role id, as emitted."
  role: Bytes!
  """
  The role that currently administers this role. Seeded to `bytes32(0)` —
  `DEFAULT_ADMIN_ROLE`, which is what OpenZeppelin `AccessControl` uses until
  `_setRoleAdmin` is called, and which it emits no event for — then moved by
  every `RoleAdminChanged`.
  """
  admin: Bytes!
  "How many accounts hold the role right now."
  holderCount: Int!
  "Every account a grant or revoke named for this role; `grantedAtBlock` is null when the grant predates indexing. Filter on `held` for the current set."
  holders: [RoleHolder!]! @derivedFrom(field: "role")
  "Grant and revoke history, oldest first by `blockNumber`."
  grantEvents: [RoleGrant!]! @derivedFrom(field: "role")
  "Admin history, oldest first by `blockNumber`. Does not include the `bytes32(0)` seed, which is not an event."
  adminChanges: [RoleAdminChange!]! @derivedFrom(field: "role")
}

"""
One account's standing against one role. Kept after a revoke (with
`held: false`) so the pair's history is reachable from the account side.
"""
type RoleHolder @entity {
  "`contract` address ++ the `bytes32` role ++ `account`."
  id: Bytes!
  "The role held."
  role: Role!
  "The account holding it."
  account: Bytes!
  "Whether the account holds the role right now."
  held: Boolean!
  "Block of the most recent `RoleGranted` to this account for this role."
  grantedAtBlock: BigInt
  "Timestamp of the most recent `RoleGranted` to this account for this role."
  grantedAtTimestamp: BigInt
  "Block of the most recent `RoleRevoked`, null if never revoked."
  revokedAtBlock: BigInt
  "Timestamp of the most recent `RoleRevoked`, null if never revoked."
  revokedAtTimestamp: BigInt
}

"One `RoleGranted` or `RoleRevoked` log."
type RoleGrant @entity(immutable: true) {
  "Transaction hash ++ log index."
  id: Bytes!
  "The role granted or revoked."
  role: Role!
  "The account it was granted to or revoked from."
  account: Bytes!
  "True for `RoleGranted`, false for `RoleRevoked`."
  granted: Boolean!
  """
  The event's own `sender` param — the `msg.sender` that called `grantRole` /
  `revokeRole` / `renounceRole`, which for a renounce is the account itself.
  Not the same as `transactionFrom` when the call came through a Safe or the
  timelock.
  """
  sender: Bytes!
  "Block the log was emitted in."
  blockNumber: BigInt!
  "Timestamp of that block."
  blockTimestamp: BigInt!
  "Hash of the transaction the log was emitted in."
  transactionHash: Bytes!
  "`tx.origin`-side sender: the EOA or account that submitted the transaction."
  transactionFrom: Bytes!
  "Index of the log within its block."
  logIndex: BigInt!
}

"""
One `RoleAdminChanged` log. `AccessControl` emits this from `_setRoleAdmin`,
including the initial wiring at construction or initialization, so the first row
for a role usually has `previousAdminRole` of `bytes32(0)`.
"""
type RoleAdminChange @entity(immutable: true) {
  "Transaction hash ++ log index."
  id: Bytes!
  "The role whose admin changed."
  role: Role!
  "The administering role before the change."
  previousAdminRole: Bytes!
  "The administering role after the change."
  newAdminRole: Bytes!
  "Block the log was emitted in."
  blockNumber: BigInt!
  "Timestamp of that block."
  blockTimestamp: BigInt!
  "Hash of the transaction the log was emitted in."
  transactionHash: Bytes!
  "The EOA or account that submitted the transaction. `RoleAdminChanged` carries no sender param."
  transactionFrom: Bytes!
  "Index of the log within its block."
  logIndex: BigInt!
}

"One `OwnershipTransferred` log."
type OwnershipTransfer @entity(immutable: true) {
  "Transaction hash ++ log index."
  id: Bytes!
  "The contract whose owner changed."
  contract: Contract!
  "The owner before the transfer. `address(0)` for the transfer `Ownable`'s constructor emits."
  previousOwner: Bytes!
  "The owner after the transfer. `address(0)` for a `renounceOwnership`."
  newOwner: Bytes!
  "Block the log was emitted in."
  blockNumber: BigInt!
  "Timestamp of that block."
  blockTimestamp: BigInt!
  "Hash of the transaction the log was emitted in."
  transactionHash: Bytes!
  "The EOA or account that submitted the transaction. `OwnershipTransferred` carries no sender param."
  transactionFrom: Bytes!
  "Index of the log within its block."
  logIndex: BigInt!
}

"One `Upgraded` log from a beacon."
type BeaconUpgrade @entity(immutable: true) {
  "Transaction hash ++ log index."
  id: Bytes!
  "The beacon that was upgraded."
  contract: Contract!
  "The implementation the beacon now serves."
  implementation: Bytes!
  "Block the log was emitted in."
  blockNumber: BigInt!
  "Timestamp of that block."
  blockTimestamp: BigInt!
  "Hash of the transaction the log was emitted in."
  transactionHash: Bytes!
  "The EOA or account that submitted the transaction. `Upgraded` carries no sender param."
  transactionFrom: Bytes!
  "Index of the log within its block."
  logIndex: BigInt!
}

"Where a `TimelockOperation` is in its lifecycle, as the timelock's own events report it."
enum TimelockOperationStatus {
  """
  Scheduled, and neither executed nor cancelled. The operation is ready to
  execute once `readyAt` is at or before the current time. `EXECUTOR_ROLE` is
  open, so after that point anyone can execute it, and OpenZeppelin never
  expires it. Cancelling is the only way to stop it.
  """
  PENDING
  "`execute` / `executeBatch` ran it. Terminal: OpenZeppelin marks the id done, so it can never be scheduled again."
  EXECUTED
  """
  `cancel` removed it before it ran. OpenZeppelin deletes the id's timestamp, so
  the same id can be scheduled again later, and that scheduling becomes a new
  `TimelockOperation` under the same `TimelockOperationKey`.
  """
  CANCELLED
}

"""
One `bytes32` operation id on one timelock, across every time it has been
scheduled. The id is OpenZeppelin's `hashOperation` / `hashOperationBatch`
over the calls, predecessor and salt, so scheduling the same calls again after
a cancel reuses the id. Each scheduling is its own `TimelockOperation`.
"""
type TimelockOperationKey @entity {
  "The timelock address followed by the `bytes32` operation id."
  id: Bytes!
  "The timelock the id belongs to."
  timelock: Contract!
  "The raw `bytes32` operation id, as emitted."
  operationId: Bytes!
  "How many times the id has been scheduled. Always at least one."
  scheduleCount: Int!
  "The most recent scheduling of the id. Its `status` is the id's current state on the timelock."
  latest: TimelockOperation!
  "Every scheduling of the id. Filter or order on `schedulingIndex`."
  operations: [TimelockOperation!]! @derivedFrom(field: "key")
}

"""
One scheduling of a timelock operation, from one `schedule` or `scheduleBatch`
call, together with what became of it.

A `schedule` call is an operation with one call. A `scheduleBatch` call is one
operation with a call per `CallScheduled` log, and executing it moves `status`
once.

To find the operations still pending against an address `X` on timelock `T`,
filter on `timelock: T, status: PENDING, targets_contains: [X]`. "Ready now" is
`readyAt <= now`. It is left to the consumer because it depends on the wall
clock, which no event moves.
"""
type TimelockOperation @entity {
  "`TimelockOperationKey.id` followed by `schedulingIndex` as a little-endian `int32`."
  id: Bytes!
  "The timelock the operation was scheduled on."
  timelock: Contract!
  "The operation id across all its schedulings."
  key: TimelockOperationKey!
  "The raw `bytes32` operation id, as emitted."
  operationId: Bytes!
  "Which scheduling of `operationId` this is, from zero."
  schedulingIndex: Int!
  "Where the operation is in its lifecycle."
  status: TimelockOperationStatus!
  "How many calls the operation makes: one for `schedule`, the batch length for `scheduleBatch`."
  callCount: Int!
  "The calls, one per `CallScheduled` log. Order on `index`."
  calls: [TimelockCall!]! @derivedFrom(field: "operation")
  "The distinct `target` of every call, for filtering with `targets_contains`."
  targets: [Bytes!]!
  "The operation that must have executed before this one can. `bytes32(0)` for none."
  predecessor: Bytes!
  """
  The salt the id was hashed with. `CallSalt` is emitted only for a non-zero
  salt, so `bytes32(0)` means the operation was scheduled without one.
  """
  salt: Bytes!
  "The delay the operation was scheduled with, in seconds."
  delay: BigInt!
  "When the operation can first execute: schedule block timestamp plus `delay`. This is the timestamp OpenZeppelin stores."
  readyAt: BigInt!
  "Block of the scheduling transaction."
  scheduledAtBlock: BigInt!
  "Timestamp of that block."
  scheduledAtTimestamp: BigInt!
  "Hash of the scheduling transaction."
  scheduledTransactionHash: Bytes!
  "The EOA or account that submitted the scheduling transaction. `CallScheduled` carries no sender param, so a Safe proposal shows up as whoever submitted the Safe transaction."
  scheduledTransactionFrom: Bytes!
  "Log index of the operation's index-0 `CallScheduled`."
  scheduledLogIndex: BigInt!
  "Block of the execution, null unless `EXECUTED`."
  executedAtBlock: BigInt
  "Timestamp of that block, null unless `EXECUTED`."
  executedAtTimestamp: BigInt
  "Hash of the executing transaction, null unless `EXECUTED`."
  executedTransactionHash: Bytes
  "The EOA or account that submitted the executing transaction, null unless `EXECUTED`."
  executedTransactionFrom: Bytes
  "Block of the cancellation, null unless `CANCELLED`."
  cancelledAtBlock: BigInt
  "Timestamp of that block, null unless `CANCELLED`."
  cancelledAtTimestamp: BigInt
  "Hash of the cancelling transaction, null unless `CANCELLED`."
  cancelledTransactionHash: Bytes
  "The EOA or account that submitted the cancelling transaction, null unless `CANCELLED`."
  cancelledTransactionFrom: Bytes
}

"One call of a `TimelockOperation`, from one `CallScheduled` log."
type TimelockCall @entity(immutable: true) {
  "`TimelockOperation.id` followed by `index` as a little-endian `int32`."
  id: Bytes!
  "The operation the call belongs to."
  operation: TimelockOperation!
  "The call's position in the operation: always zero for `schedule`, the batch position for `scheduleBatch`."
  index: Int!
  "The address the timelock calls."
  target: Bytes!
  "The native value sent with the call."
  value: BigInt!
  "The calldata."
  data: Bytes!
}

"One threshold a Safe took: the one `SafeSetup` set at creation, or a `ChangedThreshold` log."
type SafeThresholdChange @entity(immutable: true) {
  "Transaction hash ++ log index."
  id: Bytes!
  "The Safe."
  contract: Contract!
  "The threshold from this log on."
  threshold: BigInt!
  "True for the creation threshold `SafeSetup` set."
  setup: Boolean!
  "Block the log was emitted in."
  blockNumber: BigInt!
  "Timestamp of that block."
  blockTimestamp: BigInt!
  "Hash of the transaction the log was emitted in."
  transactionHash: Bytes!
  "The EOA or account that submitted the transaction."
  transactionFrom: Bytes!
  "Index of the log within its block."
  logIndex: BigInt!
}

"One owner a Safe gained or lost: each owner `SafeSetup` set at creation, an `AddedOwner` or a `RemovedOwner`."
type SafeOwnerChange @entity(immutable: true) {
  "Transaction hash ++ log index, then the owner's index within `SafeSetup`'s list for a creation owner."
  id: Bytes!
  "The Safe."
  contract: Contract!
  "The owner."
  owner: Bytes!
  "True when the owner joined, false when it left."
  added: Boolean!
  "True for an owner `SafeSetup` set at creation."
  setup: Boolean!
  "Block the log was emitted in."
  blockNumber: BigInt!
  "Timestamp of that block."
  blockTimestamp: BigInt!
  "Hash of the transaction the log was emitted in."
  transactionHash: Bytes!
  "The EOA or account that submitted the transaction."
  transactionFrom: Bytes!
  "Index of the log within its block."
  logIndex: BigInt!
}
